name: CI
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Archive exact source snapshot for reproducibility
        run: mkdir -p artifacts && git archive --format=zip HEAD -o artifacts/source.zip
      - run: npm run build && npm run check && npm test
      - name: Browser integration (synthetic WhatsApp, stubbed providers)
        run: CHROME_BIN=$(command -v google-chrome) npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-and-development-build
          path: |
            artifacts/
            dist/development.zip
          retention-days: 14
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build:release && node scripts/validate-manifest.mjs dist/chrome-store
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-store-upload
          path: dist/chrome-store.zip
